# Gradle / build infra
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Target stack. neoforge.mods.toml refers to these by name through
# generateModMetadata, so removing one breaks the build rather than the mod.
# Values are the verified 1.21.1 matrix from NEW_MOD_GUIDE.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.227
loader_version_range=[1,)

# Mod identity
mod_id=pack_stages
mod_name=Pack Stages
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.kuronami.packstages
mod_authors=KURONAMI
mod_description=Per-player stages that gate crafting, item use and workstations, defined by pack datapacks.

# Optional integrations (compile only)
jei_version=19.57.0.447
