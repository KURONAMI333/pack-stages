plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// In-game tests live in their own source set and companion mod so they never reach the shipped jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    addModdingDependenciesTo sourceSets.gametest

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "${mod_id}_gametest" {
            sourceSet(sourceSets.gametest)
        }
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            loadedMods = [project.neoForge.mods.getByName(mod_id),
                          project.neoForge.mods.getByName("${mod_id}_gametest")]
        }

        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id},${mod_id}_gametest"
            logLevel = org.slf4j.event.Level.INFO
            if (name != 'gameTestServer') {
                loadedMods = [project.neoForge.mods.getByName(mod_id)]
            }
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    // JEI API (compile only; the JEI integration class is only loaded when JEI is present).
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
}

// Host mods for runClient checks (gitignored, dev-only). Applied if present.
if (file('runclient-hosts.gradle').exists()) {
    apply from: 'runclient-hosts.gradle'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_description        : mod_description,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The shipped jar must not carry test scaffolding.
tasks.register('verifyNoTestScaffoldingInJar') {
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def bad = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { e ->
                def n = e.name
                if (n.toLowerCase().contains('gametest') || n ==~ /(?i).*\/tests?\/.*/ || n ==~ /data\/[^\/]+\/structure\/.*/) {
                    bad << n
                }
            }
        }
        if (!bad.isEmpty()) {
            throw new GradleException("Test scaffolding in shipped jar: ${bad}")
        }
    }
}
tasks.named('check') { dependsOn 'verifyNoTestScaffoldingInJar' }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
